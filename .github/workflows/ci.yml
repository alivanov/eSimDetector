name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Линтер, проверка типов, справочник, модульные тесты
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка pnpm
        uses: pnpm/action-setup@v6

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Кэш бинарных файлов mongodb-memory-server
        uses: actions/cache@v6
        with:
          # mongodb-memory-server 11.x по умолчанию (PREFER_GLOBAL_PATH=true) скачивает
          # бинарник в "~/.cache/mongodb-binaries", а не в "~/.cache/mongodb-memory-server" —
          # путь подтверждён трассировкой ошибки при первом запуске без сети.
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Форматирование (Prettier)
        run: pnpm format:check

      - name: Линтер (ESLint)
        run: pnpm lint

      - name: Проверка типов (TypeScript)
        run: pnpm typecheck

      # tools/seed резолвит workspace-пакеты через dist/ (не через moduleNameMapper Jest).
      - name: Сборка зависимостей tools-seed
        run: pnpm --filter @esim-detector/tools-seed... --if-present run build

      - name: Загрузка справочника (pnpm seed load)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/esim
        run: pnpm seed load

      - name: Сверка справочника (pnpm seed verify)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/esim
        run: pnpm seed verify

      - name: Модульные и e2e-тесты (изолированная база MongoDB в памяти)
        run: pnpm test

  build-images:
    name: Сборка Docker-образов API и web
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Сборка образа api
        run: docker build -f apps/api/Dockerfile -t esim-detector-api:ci .

      - name: Сборка образа web
        run: docker build -f apps/web/Dockerfile -t esim-detector-web:ci .
