name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Линтер, проверка типов, модульные тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка pnpm
        uses: pnpm/action-setup@v6

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Кэш бинарных файлов mongodb-memory-server
        uses: actions/cache@v6
        with:
          # mongodb-memory-server 11.x по умолчанию (PREFER_GLOBAL_PATH=true) скачивает
          # бинарник в "~/.cache/mongodb-binaries", а не в "~/.cache/mongodb-memory-server" —
          # путь подтверждён трассировкой ошибки при первом запуске без сети.
          path: ~/.cache/mongodb-binaries
          key: mongodb-memory-server-${{ runner.os }}

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Форматирование (Prettier)
        run: pnpm format:check

      - name: Линтер (ESLint)
        run: pnpm lint

      - name: Проверка типов (TypeScript)
        run: pnpm typecheck

      - name: Модульные и e2e-тесты (изолированная база MongoDB в памяти)
        run: pnpm test

  build-images:
    name: Сборка Docker-образа API
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Сборка образа api
        run: docker build -f apps/api/Dockerfile -t esim-detector-api:ci .
